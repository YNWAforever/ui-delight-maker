name: Database contract

on:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: clientops
          POSTGRES_PASSWORD: clientops
          POSTGRES_DB: clientops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U clientops"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_TEST_URL: postgres://clientops:clientops@localhost:5432/clientops_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Whole directory, not a single file: this picks up the schema contract, the route
      # loader contract and its completeness check, plus any future src/server/db test,
      # without needing another workflow edit.
      - run: bunx vitest run src/server/db/__tests__/
