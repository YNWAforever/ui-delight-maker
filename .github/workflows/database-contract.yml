name: Database contract

on:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: clientops
          POSTGRES_PASSWORD: clientops
          POSTGRES_DB: clientops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U clientops"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_TEST_URL: postgres://clientops:clientops@localhost:5432/clientops_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The whole suite, not just src/server/db/__tests__/. DATABASE_TEST_URL is set above,
      # so the integration tests that self-skip locally execute here: 887 tests run with it
      # set versus 852 passed / 35 skipped without. That makes this one command a superset of
      # the previous step, and picks up any future test without another workflow edit.
      - run: bun run test
