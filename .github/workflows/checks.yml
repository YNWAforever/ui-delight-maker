name: Checks

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: these jobs only ever read the checked-out tree. Without an explicit
# block the workflow inherits the repository default, which can be read-write — a token
# a compromised transitive dependency's postinstall could use during `bun install`.
permissions:
  contents: read

# Types and lint need no database, so they run as their own workflow rather than as a second
# job inside "Database contract" — a failure here points at the code, not at the Postgres
# service, and the two run in parallel.
jobs:
  static:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run typecheck:runtime
      - run: bun run lint
      - run: bunx vite build
      - run: bun run performance:bundles

  browser-collector:
    name: Browser collector integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser-collector
