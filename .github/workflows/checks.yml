name: Checks

on:
  pull_request:

# Least privilege: these jobs only ever read the checked-out tree. Without an explicit
# block the workflow inherits the repository default, which can be read-write — a token
# a compromised transitive dependency's postinstall could use during `bun install`.
permissions:
  contents: read

# Types and lint need no database, so they run as their own workflow rather than as a second
# job inside "Database contract" — a failure here points at the code, not at the Postgres
# service, and the two run in parallel.
jobs:
  static:
    name: Types and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint

  # CLAUDE.md lists `bun run build` in the pre-merge gate, but nothing enforced it: a change
  # that typechecks and passes tests could still break bundling, SSR-only imports or route tree
  # generation. The route performance budgets had the same problem — they only ran by hand, so a
  # budget that silently measured nothing went unnoticed. Both run here on every pull request.
  bundles:
    name: Build and performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Not `bun run build`: that script also migrates, verifies and seeds a database through
      # the Neon driver, which needs a real Neon endpoint. The bundle output is what these
      # budgets measure, so call Vite directly and keep this job database-free.
      - run: bunx vite build
      - run: bun run performance:verify
